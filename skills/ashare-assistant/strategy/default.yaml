# 默认策略模板 - 基线参考，不可修改
# 活动策略见 active.yaml，LLM 可根据复盘结论调整
strategy_version: "v1.0"

trend_stock:
  description: "趋势股交易策略"
  holding_period: "按周持股，强趋势可持续1-2个月"
  entry: "回调至MA10附近时介入，或突破前高时追入"
  stop_loss: "跌破MA20且3日内未收回"
  take_profit: "偏离MA5超过15%时减仓，或趋势评分降至3星以下"
  position: "单只不超过总仓位20%"

theme_stock:
  description: "题材股交易策略"
  holding_period: "按日持股，一般不超过2周"
  entry: "题材爆发首日或次日低吸，需龙头未见顶"
  stop_loss: "题材板块当日跌幅>3%，或个股开板未回封"
  take_profit: "题材出现明显分歧日减仓，龙头见顶全部清仓"
  position: "题材主线时可到8成，单只不超过总仓位15%"

market_position:
  strong: "6-8成仓位"
  neutral: "3-5成仓位"
  weak: "1-2成仓位或空仓"

account_mode:
  growth:
    condition: "账户盈利 ≥ +20%（hold_earn / total ≥ 0.20）"
    action: "仓位建议上调一档（如市场中性→激进），可优先关注题材机会"
  normal:
    condition: "账户在 -10% ~ +20% 范围"
    action: "按 market_position 正常操作，无额外约束"
  defensive:
    condition: "账户回撤 10%~30%（hold_earn / total ≤ -0.10）"
    action: "不开新题材仓，趋势股只减不增，仓位建议下调一档"
  critical:
    condition: "账户回撤 > 30%（hold_earn / total ≤ -0.30）"
    action: "清仓观望，待连续 3 个交易日净值回升后解除，不接受任何新仓建议"
  hysteresis_days: 3

risk_limits:
  trend_single_limit: 0.20
  theme_single_limit: 0.15
  sector_count_limit: 3
  sector_capital_limit: 0.50
  theme_total_limit: 0.80
  candidate_count_max: 10
  candidate_count_min: 3

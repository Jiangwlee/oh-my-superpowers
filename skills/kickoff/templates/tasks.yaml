# Single source of truth for task + wave state.
# - Add / remove / reorder tasks: edit this file directly.
# - Flip task status: `omp kickoff task update --story-dir <PROJECT_ROOT>/stories ...`
#   (atomic, auto-maintains started / completed / story-level `updated`).
# - Append wave snapshot (含 reviewer + commit) at wave close:
#   `omp kickoff task wave-update ...` writes into `waves[]`.
#
# Review 与 commit 的粒度是 wave，不是 task：一个 wave 一次 review、一次 commit，
# 对应字段写在 `waves[]` 末项，不写在 task 上。

story: <story-slug>          # matches directory suffix: stories/<YYYY-MM-DD>-<story-slug>/
created: <YYYY-MM-DD>
updated: <YYYY-MM-DD>        # story-level activity stamp; archive.py uses this

tasks: []
# Each task entry shape:
#   - id: "01"
#     title: <action-oriented task title>
#     status: pending          # pending | executing | completed | blocked
#     wave: 1                  # higher wave depends on lower; sequential within a wave
#     depends_on: []           # list of task ids
#     spec: null               # tasks/task-NN.md once JIT spec is written (CLI gates executing on non-null)
#     files_modified: []       # files this task will touch (estimate)
#     est_loc: 0               # estimated LOC (used for wave packing)
#     test_layer: e2e          # unit | hook | component | integration | e2e
#     worker: ""               # "inline" / "<sub-agent-id>" / "tmux:<runtime>"
#     started: null            # auto-set on first executing
#     completed: null          # auto-set on completed
#     notes: ""

waves: []
# Each wave entry shape (appended / replaced via `omp kickoff task wave-update`):
#   - number: 1
#     completed_at: <ISO8601>
#     reviewer: <agent-id-or-tmux-runtime>   # 本 wave 的独立 reviewer
#     commit: <sha>                          # 本 wave 的唯一 commit hash
#     key_decisions:           # decisions made during this wave that affect future waves
#       - "..."
#     open_questions:          # unresolved items handed to next wave or to the user
#       - "..."
#     next_focus: "..."        # one-liner: what the next wave should prioritise

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{BRIEF_TITLE}}</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap");
:root {
  --bg: #fafafa;
  --surface: #ffffff;
  --fg: #111111;
  --muted: #666666;
  --border: #dddddd;
  --soft: #f5f5f3;
  --accent: #1a1a1a;
  --success: #166534;
  --warn: #92400e;
  --danger: #b91c1c;
  --font-display: "Source Serif 4", Georgia, "Noto Serif SC", serif;
  --font-body: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  line-height: 1.55;
}
.shell {
  max-width: 1120px;
  margin: 0 auto;
  padding: 34px 24px 64px;
}
.top {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 24px;
  align-items: end;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border);
}
.eyebrow {
  color: var(--muted);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 10px;
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-size: clamp(34px, 5vw, 58px);
  line-height: 1.04;
  letter-spacing: -0.025em;
}
.meta {
  color: var(--muted);
  font-size: 13px;
  text-align: right;
}
.actions {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin: 24px 0;
}
.action {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 16px;
  min-height: 112px;
}
.action strong {
  display: block;
  margin-bottom: 6px;
}
.action p {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
}
.grid {
  display: grid;
  grid-template-columns: 1.1fr .9fr;
  gap: 18px;
}
.lead,
.section {
  background: var(--surface);
  border: 1px solid var(--border);
}
.lead {
  padding: 24px;
}
.lead h2 {
  margin: 0 0 12px;
  font-family: var(--font-display);
  font-size: 32px;
  line-height: 1.12;
  letter-spacing: -0.015em;
}
.lead p {
  margin: 0 0 18px;
  color: var(--muted);
}
.source {
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 12px;
}
.section {
  padding: 18px;
}
.section + .section {
  margin-top: 18px;
}
.section h2 {
  margin: 0 0 14px;
  font-size: 13px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.item {
  padding: 13px 0;
  border-top: 1px solid var(--border);
}
.item:first-of-type { border-top: 0; padding-top: 0; }
.item-title {
  font-weight: 600;
  margin-bottom: 4px;
}
.item-desc {
  color: var(--muted);
  font-size: 14px;
}
.tag {
  display: inline-block;
  margin-bottom: 8px;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.empty {
  padding: 18px;
  border: 1px dashed var(--border);
  color: var(--muted);
  background: var(--soft);
}
@media (max-width: 820px) {
  .top,
  .grid,
  .actions {
    display: block;
  }
  .meta {
    text-align: left;
    margin-top: 14px;
  }
  .action,
  .lead,
  .section {
    margin-bottom: 14px;
  }
}
</style>
</head>
<body>
<main class="shell">
  <header class="top">
    <div>
      <div class="eyebrow">{{TARGET_SKILL}} / brief</div>
      <h1>{{BRIEF_TITLE}}</h1>
    </div>
    <div class="meta">
      <div>{{GENERATED_AT}}</div>
      <div>{{ITEM_COUNT}} items · {{OPEN_COUNT}} open</div>
    </div>
  </header>

  <section class="actions" aria-label="Priority actions">
    {{ACTION_ITEMS}}
  </section>

  <section class="grid">
    <article class="lead">
      <span class="tag">Lead</span>
      <h2>{{LEAD_TITLE}}</h2>
      <p>{{LEAD_SUMMARY}}</p>
      <div class="source">{{LEAD_SOURCE}}</div>
    </article>

    <div>
      <section class="section">
        <h2>Needs Attention</h2>
        {{NEEDS_ATTENTION_ITEMS}}
      </section>

      <section class="section">
        <h2>Worth Knowing</h2>
        {{SECONDARY_ITEMS}}
      </section>
    </div>
  </section>
</main>
</body>
</html>

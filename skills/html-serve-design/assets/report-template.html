<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{REPORT_TITLE}}</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap");
:root {
  --bg: #fafafa;
  --surface: #ffffff;
  --fg: #111111;
  --muted: #666666;
  --border: #dddddd;
  --soft: #f5f5f3;
  --accent: #1a1a1a;
  --font-display: "Source Serif 4", Georgia, "Noto Serif SC", serif;
  --font-body: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  line-height: 1.65;
}
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.shell {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 240px;
  gap: 48px;
  max-width: 1180px;
  margin: 0 auto;
  padding: 48px 28px 72px;
}
.report {
  max-width: 68ch;
}
.eyebrow {
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 14px;
}
h1 {
  margin: 0 0 18px;
  font-family: var(--font-display);
  font-size: clamp(40px, 6vw, 76px);
  line-height: 1.02;
  letter-spacing: -0.03em;
  font-weight: 700;
}
.deck {
  margin: 0 0 28px;
  font-size: 20px;
  line-height: 1.45;
  color: var(--muted);
}
.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 18px;
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 44px;
}
.summary {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 22px;
  margin: 0 0 44px;
}
.summary h2,
.section h2,
.sources h2 {
  margin: 0 0 14px;
  font-family: var(--font-display);
  font-size: 28px;
  line-height: 1.15;
  letter-spacing: -0.01em;
}
.summary ol,
.section ul {
  margin: 0;
  padding-left: 22px;
}
.summary li + li { margin-top: 10px; }
.section {
  margin: 48px 0;
}
.section p {
  margin: 0 0 18px;
}
.callout {
  margin: 28px 0;
  padding: 18px 20px;
  background: var(--soft);
  border: 1px solid var(--border);
}
.sources {
  margin-top: 56px;
  padding-top: 28px;
  border-top: 1px solid var(--border);
}
.source-list {
  display: grid;
  gap: 12px;
}
.source {
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
}
.source-title {
  font-weight: 600;
}
.source-meta {
  margin-top: 4px;
  color: var(--muted);
  font-size: 13px;
}
.toc {
  position: sticky;
  top: 24px;
  align-self: start;
  color: var(--muted);
  font-size: 13px;
}
.toc-title {
  color: var(--fg);
  font-weight: 600;
  margin-bottom: 10px;
}
.toc a {
  display: block;
  padding: 6px 0;
  text-decoration: none;
}
.toc a:hover { color: var(--fg); }
.audit {
  margin-top: 44px;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 12px;
}
@media (max-width: 860px) {
  .shell {
    display: block;
    padding: 32px 20px 56px;
  }
  .toc {
    position: static;
    margin: 0 0 32px;
    padding: 12px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 42px; }
}
</style>
</head>
<body>
<main class="shell">
  <article class="report">
    <header>
      <div class="eyebrow">{{TARGET_SKILL}} / {{PAGE_TYPE}}</div>
      <h1>{{REPORT_TITLE}}</h1>
      <p class="deck">{{REPORT_DECK}}</p>
      <div class="meta">
        <span>{{GENERATED_AT}}</span>
        <span>{{SOURCE_COUNT}} sources</span>
        <span>{{WORKSPACE_LABEL}}</span>
      </div>
    </header>

    <section class="summary" id="summary">
      <h2>Core Conclusions</h2>
      <ol>
        {{CORE_CONCLUSIONS}}
      </ol>
    </section>

    {{REPORT_SECTIONS}}

    <section class="sources" id="sources">
      <h2>Sources</h2>
      <div class="source-list">
        {{SOURCE_ITEMS}}
      </div>
    </section>

    <footer class="audit">
      {{AUDIT_NOTE}}
    </footer>
  </article>

  <nav class="toc" aria-label="Table of contents">
    <div class="toc-title">Contents</div>
    <a href="#summary">Core Conclusions</a>
    {{TOC_ITEMS}}
    <a href="#sources">Sources</a>
  </nav>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{INDEX_TITLE}}</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap");
:root {
  --bg: #fafafa;
  --surface: #ffffff;
  --fg: #111111;
  --muted: #666666;
  --border: #dddddd;
  --soft: #f5f5f3;
  --accent: #1a1a1a;
  --font-body: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  line-height: 1.5;
}
.shell {
  max-width: 1120px;
  margin: 0 auto;
  padding: 32px 22px 64px;
}
.top {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 280px;
  gap: 24px;
  align-items: end;
  margin-bottom: 24px;
}
.eyebrow {
  color: var(--muted);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
h1 {
  margin: 0;
  font-size: clamp(30px, 4vw, 48px);
  line-height: 1.08;
  letter-spacing: -0.02em;
}
.search input {
  width: 100%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--fg);
  font: inherit;
  padding: 10px 12px;
  outline: none;
}
.search input:focus {
  border-color: var(--accent);
}
.groups {
  display: grid;
  gap: 18px;
}
.group {
  background: var(--surface);
  border: 1px solid var(--border);
}
.group-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}
.group-head h2 {
  margin: 0;
  font-size: 14px;
}
.group-head span {
  color: var(--muted);
  font-size: 13px;
}
.artifact {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 150px 110px;
  gap: 16px;
  align-items: center;
  padding: 14px 16px;
  border-top: 1px solid var(--border);
  color: inherit;
  text-decoration: none;
}
.artifact:first-of-type {
  border-top: 0;
}
.artifact:hover {
  background: var(--soft);
}
.title {
  font-weight: 600;
}
.desc,
.date,
.type {
  color: var(--muted);
  font-size: 13px;
}
.date,
.type {
  font-family: var(--font-mono);
}
.empty {
  padding: 24px 16px;
  color: var(--muted);
  border-top: 1px dashed var(--border);
}
@media (max-width: 760px) {
  .top,
  .artifact {
    display: block;
  }
  .search {
    margin-top: 14px;
  }
  .date,
  .type {
    margin-top: 6px;
  }
}
</style>
</head>
<body>
<main class="shell">
  <header class="top">
    <div>
      <div class="eyebrow">{{TARGET_NAMESPACE}} / index</div>
      <h1>{{INDEX_TITLE}}</h1>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="Filter artifacts">
    </div>
  </header>

  <section class="groups" id="groups">
    {{ARTIFACT_GROUPS}}
  </section>
</main>

<script>
const q = document.getElementById("q");
q.addEventListener("input", () => {
  const term = q.value.trim().toLowerCase();
  document.querySelectorAll(".artifact").forEach(row => {
    row.hidden = term && !row.textContent.toLowerCase().includes(term);
  });
});
</script>
</body>
</html>

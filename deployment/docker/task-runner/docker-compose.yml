services:
  task-runner:
    build:
      context: ../../../packages/task-runner
      dockerfile: Dockerfile
    container_name: task_runner
    restart: unless-stopped
    ports:
      - "10004:8000"
    env_file:
      - .env
    environment:
      # Timezone
      - TZ=${TZ:-Asia/Shanghai}
      
      # Ashare-Data configuration (use /root in container)
      - ASHARE_OUTPUT_DIR=${ASHARE_OUTPUT_DIR:-/root/.ashare-assistant}
      
      # Logging level
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      
      # JVQuant credentials (optional)
      # If set, broker account data will be collected
      - JVQUANT_APP_TOKEN=${JVQUANT_APP_TOKEN:-}
      - EASTMONEY_ACCOUNT=${EASTMONEY_ACCOUNT:-}
      - EASTMONEY_PASSWORD=${EASTMONEY_PASSWORD:-}
      
      # JVQuant credentials file path (optional, use /root in container)
      - JVQUANT_CREDENTIALS_PATH=${JVQUANT_CREDENTIALS_PATH:-/root/.ashare-data/jvquant.json}
    volumes:
      # ashare_data 源码挂载（只读）
      - /home/bruce/Projects/oh-my-superpowers/packages/ashare-data/ashare_data:/usr/local/lib/python3.12/site-packages/ashare_data:ro
      # task-runner 源码挂载
      - /home/bruce/Projects/oh-my-superpowers/packages/task-runner:/install/task-runner
      # 数据持久化 - 宿主机路径 → 容器内/root路径
      - ./data/ashare-assistant:/root/.ashare-assistant
    networks:
      - infra_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${UVICORN_PORT:-8000}/health')"]
      interval: ${HEALTH_CHECK_INTERVAL:-30}s
      timeout: ${HEALTH_CHECK_TIMEOUT:-10}s
      retries: ${HEALTH_CHECK_RETRIES:-3}
      start_period: ${HEALTH_CHECK_START_PERIOD:-10}s

networks:
  infra_net:
    external: true

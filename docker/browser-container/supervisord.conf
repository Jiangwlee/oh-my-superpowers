; Supervisor config for omp browser-container.
;
; Boot order:
;   dbus(10) -> Xvfb(20) -> openbox(30) -> chrome(40)
;   -> x11vnc viewonly(50) / interactive(51)
;   -> noVNC viewonly(60) / interactive(61)
;   -> REST(70) -> MCP(71)
;
; VNC plan A (server-enforced): the viewonly port is physically read-only, so a
; watching user cannot perturb a running automation. Only the interactive port
; accepts input — mindora connects there only inside a takeover window.

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/omp-browser/dbus.log
stderr_logfile=/var/log/omp-browser/dbus.err

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1280x800x24 -nolisten tcp -dpi 96
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/omp-browser/xvfb.log
stderr_logfile=/var/log/omp-browser/xvfb.err

[program:openbox]
command=/usr/bin/openbox-session
environment=DISPLAY=":1",HOME="/root"
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/omp-browser/openbox.log
stderr_logfile=/var/log/omp-browser/openbox.err

[program:chrome]
command=/usr/bin/chromium
    --no-sandbox --no-first-run --no-default-browser-check --disable-gpu
    --disable-dev-shm-usage --window-size=1280,800 --disable-infobars
    --user-data-dir=/data/profile
    --remote-debugging-port=9222 --remote-debugging-address=127.0.0.1
    about:blank
environment=DISPLAY=":1",HOME="/root",XDG_RUNTIME_DIR="/tmp/runtime-root"
autostart=true
autorestart=true
priority=40
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/omp-browser/chrome.log
stderr_logfile=/var/log/omp-browser/chrome.err

[program:x11vnc_viewonly]
command=/usr/bin/x11vnc -display :1 -forever -shared -viewonly -rfbport 5900 -nopw -noxdamage -quiet
autostart=true
autorestart=true
priority=50
stdout_logfile=/var/log/omp-browser/x11vnc_viewonly.log
stderr_logfile=/var/log/omp-browser/x11vnc_viewonly.err

[program:x11vnc_interactive]
command=/usr/bin/x11vnc -display :1 -forever -shared -rfbport 5901 -nopw -noxdamage -quiet
autostart=true
autorestart=true
priority=51
stdout_logfile=/var/log/omp-browser/x11vnc_interactive.log
stderr_logfile=/var/log/omp-browser/x11vnc_interactive.err

[program:novnc_viewonly]
command=/usr/bin/websockify --web=/usr/share/novnc/ 6080 localhost:5900
autostart=true
autorestart=true
priority=60
stdout_logfile=/var/log/omp-browser/novnc_viewonly.log
stderr_logfile=/var/log/omp-browser/novnc_viewonly.err

[program:novnc_interactive]
command=/usr/bin/websockify --web=/usr/share/novnc/ 6081 localhost:5901
autostart=true
autorestart=true
priority=61
stdout_logfile=/var/log/omp-browser/novnc_interactive.log
stderr_logfile=/var/log/omp-browser/novnc_interactive.err

[program:rest]
command=/opt/omp-browser/venv/bin/uvicorn app.rest.main:app --host 0.0.0.0 --port 8080
environment=CDP_HOST="127.0.0.1",CDP_PORT="9222"
autostart=true
autorestart=true
priority=70
startsecs=3
stdout_logfile=/var/log/omp-browser/rest.log
stderr_logfile=/var/log/omp-browser/rest.err

[program:mcp]
command=/opt/omp-browser/venv/bin/python -m app.mcp.server
environment=CDP_HOST="127.0.0.1",CDP_PORT="9222",MCP_HOST="0.0.0.0",MCP_PORT="9223"
autostart=true
autorestart=true
priority=71
startsecs=3
stdout_logfile=/var/log/omp-browser/mcp.log
stderr_logfile=/var/log/omp-browser/mcp.err

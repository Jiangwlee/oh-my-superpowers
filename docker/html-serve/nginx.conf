server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    autoindex on;
    autoindex_localtime on;
    autoindex_exact_size off;

    charset utf-8;

    location /_api/ {
        alias /usr/share/nginx/html/;
        index _nonexistent;
        autoindex on;
        autoindex_format json;
        autoindex_localtime on;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

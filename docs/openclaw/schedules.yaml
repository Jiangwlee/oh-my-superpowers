timezone: Asia/Shanghai
jobs:
  - name: eod_review_and_plan
    cron: "10 15 * * 1-5"
    action:
      run_skills:
        - a-share-trend-scanner
        - a-share-trade-plan-compiler
      outputs:
        - data/pools/{{trade_date}}/candidate_pool.json
        - data/pools/{{trade_date}}/plan_draft.json
        - data/plans/{{trade_date}}/trade_plan.v1.json

  - name: preopen_bootstrap
    cron: "20 9 * * 1-5"
    action:
      initialize_runtime: true
      allocate_servers: [trade, websocket, sql]
      broker_login: true

  - name: open_window_execution
    cron: "30-35 9 * * 1-5"
    action:
      mode: opening_batches
      event_source: market_and_order
      pipeline:
        - a-share-trade-event-executor
        - a-share-trade-risk-gate
        - a-share-trade-broker-jvquant

  - name: intraday_event_loop_morning
    cron: "36-59 9,10,11 * * 1-5"
    action:
      mode: event_driven
      market_window_guard: true
      pipeline:
        - a-share-trade-event-executor
        - a-share-trade-risk-gate
        - a-share-trade-broker-jvquant

  - name: intraday_event_loop_afternoon
    cron: "0-59 13,14 * * 1-5"
    action:
      mode: event_driven
      market_window_guard: true
      pipeline:
        - a-share-trade-event-executor
        - a-share-trade-risk-gate
        - a-share-trade-broker-jvquant

  - name: postclose_reflection
    cron: "10 15 * * 1-5"
    action:
      run_skills:
        - a-share-trade-reflection-evolver
      outputs:
        - data/journals/{{trade_date}}/reflection.md
        - data/params/history/{{trade_date}}-v1.yaml
        - data/metrics/daily_metrics.csv

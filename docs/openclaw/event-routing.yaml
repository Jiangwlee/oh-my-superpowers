pipeline:
  - stage: event_executor
    skill: a-share-trade-event-executor
    input:
      - market_event
      - order_event
      - position_snapshot
      - trade_plan
    output: order_intent
    contract: docs/contracts/order_intent.schema.json

  - stage: risk_gate
    skill: a-share-trade-risk-gate
    input:
      - order_intent
      - day_fill_counter
      - position_state
    output: risk_decision
    contract: docs/contracts/risk_decision.schema.json
    hard_reject_on_fail: true

  - stage: broker_adapter
    skill: a-share-trade-broker-jvquant
    when: risk_decision.allow == true
    input:
      - order_intent
      - risk_decision
    output: execution_report
    contract: docs/contracts/execution_report.schema.json

  - stage: ledger
    action: append_event_log
    input:
      - event_id
      - order_intent.intent_id
      - risk_decision
      - execution_report
    output: data/events/trade_events.jsonl

retries:
  allocate_server:
    attempts: 3
    backoff_seconds: [1, 2, 5]
  ws_reconnect:
    attempts: 3
    backoff_seconds: [0, 5, 15]
  order_submit:
    attempts: 1
    on_timeout: query_order_then_decide

idempotency:
  keys:
    - event_id
    - intent_id
    - client_order_id
  duplicate_policy: reject_and_log

alerts:
  on_risk_reject: true
  on_uncertain_order_state: true
  on_ws_disconnect_exhausted: true
